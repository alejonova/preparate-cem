{% extends 'base.html' %}{% block title %}Examen{% endblock %}{% block content %}<div class="card"><div style="display:flex;justify-content:space-between"><strong>{{ subject.name }}</strong><span class="timer" id="timer">--:--:--</span></div><p class="muted">Pregunta {{ position }} de {{ total }}</p><h2>{{ question.text }}</h2><form method="post">{% csrf_token %}<div class="options">{% for option in options %}<label><input type="radio" name="answer" value="{{ option.label }}"> <strong>{{ option.label }})</strong> {{ option.text }}</label>{% endfor %}</div><div style="display:flex;justify-content:flex-end;margin-top:20px">{% if position < total %}<button class="btn" name="action" value="next">Siguiente</button>{% else %}<button class="btn" name="action" value="finish">Finalizar examen</button>{% endif %}</div></form></div><script>let remaining={{ remaining_seconds }};function tick(){let h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;document.getElementById('timer').textContent=[h,m,s].map((x,i)=>String(x).padStart(2,'0')).join(':');if(remaining<=0){window.location.href="{% url 'finish_exam' %}"}remaining--;}tick();setInterval(tick,1000);</script>{% endblock %}
